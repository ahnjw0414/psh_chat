<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>풍생고등학교 익명 채팅 - 관리자 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 관리자 전용 대시보드 레이아웃 (기존 style.css에 더해 조절) */
        .admin-body { display: flex; width: 100vw; height: 100vh; background-color: #f0f2f5; }
        .sidebar { width: 300px; background-color: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #eee; background-color: #007AFF; color: white; }
        .student-list { flex: 1; overflow-y: auto; }
        .student-item { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
        .student-item:hover { background-color: #f5f5f7; }
        .student-item.active { background-color: #e3efff; font-weight: bold; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .admin-chat-header { padding: 15px 20px; background-color: #fff; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .admin-controls { display: flex; gap: 10px; align-items: center; }
        .admin-controls select { padding: 6px; border-radius: 6px; border: 1px solid #ccc; }
        .block-btn { background-color: #ff3b30; color: white; padding: 6px 12px; font-size: 0.85rem; width: auto; }
    </style>
</head>
<body>
    <div class="admin-body">
        <aside class="sidebar">
            <div class="sidebar-header">풍생고 관리자 대시보드</div>
            <div class="student-list" id="student-list">
                <div style="padding:20px; color:#999; text-align:center;">대화 중인 학생이 없습니다.</div>
            </div>
            <button id="admin-logout-btn" style="background-color:#555; color:white; border-radius:0;">로그아웃</button>
        </aside>

        <main class="main-content">
            <header class="admin-chat-header">
                <div>
                    <span id="target-student-info" style="font-weight: bold; font-size: 1.1rem;">학생을 선택해주세요.</span>
                    <span id="target-student-email" style="font-size: 0.85rem; color: #888; margin-left: 10px;"></span>
                </div>
                <div class="admin-controls" id="control-panel" style="display: none;">
                    <select id="student-role-select">
                        <option value="student">일반 학생</option>
                        <option value="학생부회장">학생부회장</option>
                        <option value="총무기획부">총무기획부</option>
                        <option value="admin">최고 관리자</option>
                    </select>
                    <button id="save-role-btn" style="width:auto; padding:6px 12px; background-color:#4cd964; color:white;">부서 저장</button>
                    <button id="block-user-btn" class="block-btn">이 학생 차단</button>
                </div>
            </header>

            <div class="chat-messages" id="admin-chat-messages" style="flex:1;">
                <div style="text-align: center; color: #999; margin-top: 50px;">왼쪽 리스트에서 학생을 클릭하면 대화가 시작됩니다.</div>
            </div>

            <footer class="chat-input-area" id="admin-input-area" style="display: none;">
                <div class="input-form">
                    <input type="text" id="admin-message-input" placeholder="답장을 입력하세요...">
                    <button id="admin-send-btn">전송</button>
                </div>
            </footer>
        </main>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
