<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>풍생고 익명 채팅방 - 로그인</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <img src="assets/logo.png" alt="풍생고등학교 로고" class="logo">
        
        <h1>환영합니다.<br>풍생고등학교 익명 채팅방입니다.</h1>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="풍생고등학교 계정으로 로그인 해주세요." required>
            </div>
            
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요." required>
            </div>
            
            <div class="button-group">
                <button type="button" id="login-btn">로그인</button>
                <button type="button" id="signup-btn">@ps.hs.kr로 회원가입</button>
            </div>
        </form>

        <div class="extra-links">
            <a href="#" id="forgot-password">비밀번호를 잊으셨나요?</a>
        </div>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
