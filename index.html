<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>풍생고등학교 익명 채팅방 - 로그인</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <img src="assets/school_mark2.png" alt="풍생고등학교 로고" class="logo">
        
        <h1>환영합니다.<br>풍생고등학교 익명 채팅방입니다.</h1>
        
        <div class="input-group">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="풍생고등학교 계정(@ps.hs.kr)으로 로그인해주세요." required>
        </div>
        
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력해주세요." required>
        </div>
        
        <div class="button-group">
            <button id="login-btn">로그인</button>
            <button id="signup-btn">@ps.hs.kr로 회원가입</button>
        </div>
        
        <div class="extra-links">
            <a href="#" id="find-pwd-btn">비밀번호를 잊으셨나요?</a>
        </div>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
